services:
  db:
    container_name: NEXUS_DEPLOY_POSTGRES
    image: postgres:17
    

    environment:
      POSTGRES_DB: ${PG_DB_NAME}
      POSTGRES_USER: ${PG_DB_USER}
      POSTGRES_PASSWORD: ${PG_DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_ready -U ${PG_DB_USER} -d ${PG_DB_NAME}"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
  
  pg_admin:
    container_name: NEXUS_DEPLOY_PGADMIN

    image: dpage/pgadmin4
    
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    
    restart: always
    
    ports:
      - "5050:80"
    
    volumes:
      - pg_admin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - backend
volumes:
  postgres_data:
  pg_admin_data:

networks:
  backend:
    driver: bridge