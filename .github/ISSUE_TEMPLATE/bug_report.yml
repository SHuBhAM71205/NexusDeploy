name: Bug Report
description: Report a bug or unexpected behavior.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for reporting a bug!

        Please complete the form below. The more details you provide, the easier it is to investigate and resolve the issue.

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Briefly describe the problem.
      placeholder: A short summary of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe how to reproduce the bug.
      placeholder: |
        1. Go to...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: Describe what actually happened.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Project Version
      placeholder: v1.0.0

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Windows 11 / Ubuntu 24.04 / macOS

  - type: input
    id: browser
    attributes:
      label: Browser (if applicable)
      placeholder: Chrome / Firefox / Edge

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Include logs, stack traces, or screenshots if available.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: Anything else that may help us investigate?