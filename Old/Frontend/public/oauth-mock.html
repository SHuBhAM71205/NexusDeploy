<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus DevOps - Authorize Connection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #161b26;
      --bg-card: rgba(22, 27, 38, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --info: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .header {
      margin-bottom: 30px;
    }

    .app-connection {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .icon-box {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      font-size: 24px;
      color: var(--primary);
    }

    .icon-box.nexus {
      background: linear-gradient(135deg, var(--primary), var(--info));
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .connection-line {
      flex-grow: 1;
      height: 1px;
      border-top: 1px dashed var(--border-color);
      max-width: 60px;
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .form {
      text-align: left;
      margin-top: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.2);
    }

    .hint-link {
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      align-self: flex-end;
    }

    .hint-link:hover {
      text-decoration: underline;
    }

    .permissions-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .permissions-box h4 {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .permissions-list {
      list-style: none;
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .permissions-list li {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .permissions-list li::before {
      content: "✓";
      color: var(--success);
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .logo-img {
      max-width: 24px;
      max-height: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="app-connection">
        <div class="icon-box nexus" title="Nexus DevOps">N</div>
        <div class="connection-line"></div>
        <div class="icon-box" id="provider-icon">?</div>
      </div>
      <h2 class="title" id="title-text">Connect Account</h2>
      <p class="subtitle" id="subtitle-text">Authorize Nexus DevOps Platform to coordinate deployments on your behalf.</p>
    </div>

    <div class="permissions-box">
      <h4>Permissions Requested</h4>
      <ul class="permissions-list" id="permissions-list">
        <li>Create and deploy static services</li>
        <li>Configure environment variables</li>
        <li>Read deployment statuses & logs</li>
      </ul>
    </div>

    <form class="form" id="auth-form" onsubmit="handleAuth(event)">
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label id="input-label" for="token-input">API Token / Private Key</label>
          <a href="#" target="_blank" class="hint-link" id="hint-link">Where do I get this?</a>
        </div>
        <input type="password" id="token-input" required placeholder="Enter token...">
      </div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="handleCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary">Authorize Access</button>
      </div>
    </form>
  </div>

  <script>
    // Extract query params
    const params = new URLSearchParams(window.location.search);
    const provider = params.get('provider') || 'vercel';
    
    const config = {
      github: {
        name: 'GitHub',
        icon: '🐙',
        label: 'GitHub Personal Access Token (PAT)',
        hint: 'https://github.com/settings/tokens',
        permissions: ['Read repository contents', 'Create private repositories', 'Push commits to branch main']
      },
      vercel: {
        name: 'Vercel',
        icon: '▲',
        label: 'Vercel API Token',
        hint: 'https://vercel.com/account/tokens',
        permissions: ['Create static and serverless projects', 'Trigger deployments', 'Read execution build logs']
      },
      netlify: {
        name: 'Netlify',
        icon: '◈',
        label: 'Netlify Personal Access Token',
        hint: 'https://app.netlify.com/user/settings/applications',
        permissions: ['Create static sites', 'Upload precompiled distributions', 'Manage domain routes']
      }
    };

    const provConfig = config[provider.toLowerCase()] || config.vercel;

    // Update UI based on provider config
    document.getElementById('provider-icon').textContent = provConfig.icon;
    document.getElementById('title-text').textContent = `Connect ${provConfig.name}`;
    document.getElementById('input-label').textContent = provConfig.label;
    document.getElementById('hint-link').href = provConfig.hint;
    document.title = `Nexus DevOps - Authorize ${provConfig.name}`;

    const permList = document.getElementById('permissions-list');
    permList.innerHTML = '';
    provConfig.permissions.forEach(perm => {
      const li = document.createElement('li');
      li.textContent = perm;
      permList.appendChild(li);
    });

    function handleAuth(e) {
      e.preventDefault();
      const tokenVal = document.getElementById('token-input').value.trim();
      if (!tokenVal) return;

      // Post back to parent window
      window.opener.postMessage({
        type: 'nexus-oauth-success',
        provider: provider.toLowerCase(),
        token: tokenVal
      }, '*');

      window.close();
    }

    function handleCancel() {
      window.close();
    }
  </script>
</body>
</html>
